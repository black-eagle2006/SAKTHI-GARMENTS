spring:
  datasource:
    url: jdbc:h2:file:./data/sakthidb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false # In H2 dev mode, Hibernate auto-generates schema; Flyway runs on MySQL profile

migration:
  mongo:
    enabled: true
    source-mode: FILE
    export-directory: classpath:data/mongodb_export
