server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: sakthi-garments-production
  mvc:
    problemdetails:
      enabled: true

  # Dynamic Datasource: Use MySQL if DB_HOST/MYSQL_HOST or DATABASE_URL is set, otherwise persistent H2
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:file:./data/sakthi_prod_db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}}
    username: ${DB_USERNAME:${MYSQL_USER:sa}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:}}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false

# Production Security & Configuration
app:
  jwt:
    secret: "${JWT_SECRET:sakthi_garments_ultra_secure_jwt_signing_secret_key_tiruppur_2026_super_long_key}"
    expiration-ms: 86400000
  cors:
    allowed-origins:
      - "*"
  gemini:
    api-key: "${GEMINI_API_KEY:}"
    model: "gemini-3.1-flash-lite"
    api-url: "https://generativelanguage.googleapis.com/v1beta/models"
    timeout-ms: 10000
  razorpay:
    key-id: "${RAZORPAY_KEY_ID:rzp_test_sakthi}"
    key-secret: "${RAZORPAY_KEY_SECRET:mock_secret}"
    test-mode: true
  pricing:
    sample-base-price: 69.0
    plain-tshirt-base-price: 249.0
    custom-tshirt-base-price: 299.0
    front-layer-surcharge: 50.0
    back-print-surcharge: 80.0
    gst-rate-percent: 5.0
    free-shipping-threshold: 999.0
    shipping-fee: 50.0
