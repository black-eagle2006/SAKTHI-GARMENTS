version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: sakthi_mysql
    restart: always
    environment:
      MYSQL_DATABASE: sakthi_garments
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sakthi_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakthi_backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: sakthi_garments
      DB_USERNAME: root
      DB_PASSWORD: root
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: sakthi_garments
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_sakthi}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-mock_secret}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sakthi_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sakthi_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - sakthi_network

volumes:
  mysql_data:

networks:
  sakthi_network:
    driver: bridge
